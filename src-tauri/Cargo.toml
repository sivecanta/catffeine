[package]
name = "catffeine"
version = "0.2.0"
description = "A cozy cross-platform desktop cat that prevents your system from sleeping"
authors = ["Catffeine Contributors"]
edition = "2021"

[lib]
name = "catffeine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = true }
