name: Release (Windows, macOS, Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag (e.g. v0.1.1)"
        required: true
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish pre-release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "Catffeine ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }} — AI Agent Tracker, Sound Controls & Until Agent Done (Pre-release)"
          releaseBody: |
            A cozy, lightweight pixel-art desktop companion cat that lives on your desktop, Windows System Tray, or macOS Menu Bar — keeping your computer awake indefinitely, on a timer (`30m` / `1h` / `2h`), **until your tracked AI agent finishes**, or automatically while AI coding agents (**Claude**, **Codex**, **Antigravity**, **Cursor**) and CLI tasks are running.

            ### 📦 Direct Downloads

            | OS | Architecture | Download Link | Format / Notes |
            | :--- | :--- | :--- | :--- |
            | **Windows 10 / 11** | `x86_64` (64-bit) | [**`catffeine.exe`**](https://github.com/sivecanta/catffeine/releases/download/v0.1.1/catffeine.exe) | Standalone portable executable (double-click to run) |
            | **Windows 10 / 11 (Installer)** | `x86_64` (64-bit) | [**`Catffeine_0.1.1_x64-setup.exe`**](https://github.com/sivecanta/catffeine/releases/download/v0.1.1/Catffeine_0.1.1_x64-setup.exe) | Windows NSIS installer |
            | **macOS (Apple Silicon)** | `aarch64` (`M1`–`M4`) | [**`Catffeine_0.1.1_aarch64.dmg`**](https://github.com/sivecanta/catffeine/releases/download/v0.1.1/Catffeine_0.1.1_aarch64.dmg) | macOS Disk Image installer |
            | **macOS (Intel)** | `x86_64` | [**`Catffeine_0.1.1_x64.dmg`**](https://github.com/sivecanta/catffeine/releases/download/v0.1.1/Catffeine_0.1.1_x64.dmg) | macOS Disk Image installer |
            | **Linux (Ubuntu / Debian)** | `x86_64` (`amd64`) | [**`Catffeine_0.1.1_amd64.deb`**](https://github.com/sivecanta/catffeine/releases/download/v0.1.1/Catffeine_0.1.1_amd64.deb) | Debian package (`sudo apt install ./Catffeine_0.1.1_amd64.deb`) |
            | **Linux (Fedora / RHEL)** | `x86_64` | [**`Catffeine-0.1.1-1.x86_64.rpm`**](https://github.com/sivecanta/catffeine/releases/download/v0.1.1/Catffeine-0.1.1-1.x86_64.rpm) | RPM package (`sudo dnf install ./Catffeine-0.1.1-1.x86_64.rpm`) |
            | **Linux (Standalone)** | `x86_64` | [**`catffeine-linux-x86_64`**](https://github.com/sivecanta/catffeine/releases/download/v0.1.1/catffeine-linux-x86_64) | Standalone binary (`chmod +x catffeine-linux-x86_64 && ./catffeine-linux-x86_64`) |

            *(All attached files are also listed under **Assets** at the bottom of this release.)*

            > **First launch of unsigned pre-release builds**: Windows Smart App Control / SmartScreen and macOS Gatekeeper may warn about apps without a paid code-signing certificate. On Windows choose **More info → Run anyway** (SmartScreen); on macOS right-click `Catffeine.app` → **Open** once. The macOS builds are ad-hoc signed so Apple Silicon won't report them as "damaged".

            ---

            ### 🚀 What's New Since `v0.1.0`

            - **🤖 Live AI Agent Tracker (`Track` Menu)**:
              - Hover over the **`Track`** button on the status bar to select **Claude**, **Codex**, **Antigravity**, or **Cursor** (single-select; click again to unselect).
              - Automatically switches the cat into **Working** mode (pixel coding glasses + mini laptop + OS sleep inhibition) while the tracked agent is running, and chirps a **`<Agent> done! Meow!`** notification only when the entire turn completes.
              - **Multi-Step & Parallel Subagent Accuracy (Native + WSL)**:
                - **Antigravity**: Tracks mid-turn `PLANNER_RESPONSE` tool calls, `GENERIC` steps, and background tasks with `"status":"RUNNING"` until completion.
                - **Cursor**: Tracks parent and all parallel `subagents/*.jsonl` transcripts across native and WSL (`~/.cursor/projects/*/agent-transcripts`) until every subagent and parent transcript writes `turn_ended`.
                - **Claude Code**: Scans past mid-turn housekeeping entries (`cost-state`, `last-prompt`, etc.) and inspects `subagents/*.meta.json` (`"finished": true/false`).
                - **Codex**: Tracks active `thread-writer-locks`, `process_manager`, and rollout `sessions/**/*.jsonl` until `turn.completed` / `task_complete` while ignoring idle background telemetry.
            - **⏳ `Until Agent Done` Stay-Awake Policy**:
              - New **Stay Awake → Until Agent Done** option in the right-click menu and system tray.
              - Keeps your computer awake (`Agent` badge) while waiting for or running an AI agent, then automatically switches to **Off (Allow Sleep)** as soon as the agent finishes.
            - **🔊 Synthesized Meow & Sound Controls**:
              - **Wake-Up & Completion Meow**: Web Audio API synthesized **"mew!"** chirp and pixel speech bubble (`Meow!` when waking the cat, `<Agent> done! Meow!` when a tracked agent finishes).
              - **Mute & Volume Slider**: Right-click menu includes a **Mute Meow** toggle and a **Vol (`0%–100%`)** slider with live preview and `localStorage` persistence.
            - **🪟 Clean, Scrollbar-Free Context Menu**:
              - Compact menu layout and cross-platform CSS scrollbar suppression across Windows (`WebView2`), macOS (`WebKit`), and Linux (`WebKitGTK`).

            ---

            ### ✨ Core Features

            - **🐾 Pixel-Art Desktop Cat**:
              - **Sleeping (`off`)**: Curled up with floating `Zzz`s — normal OS sleep allowed.
              - **Awake (`indefinite` / `until-agent-done` / timer)**: Sitting up with a steaming coffee mug — prevents system & display sleep.
              - **Working (`agent` active)**: Puts on pixel glasses and types on a mini laptop whenever a tracked AI agent or CLI task is running.
            - **📌 Pin & Move Anywhere**:
              - Unlock with **Unpin & Move** to drag the cat anywhere on your screen, then click the **Pin Here** badge (or right-click menu) to lock it in place.
              - Quick-snap presets for **Bottom Right** and **Bottom Left** above the taskbar/dock.
            - **🖥️ System Tray / Menu Bar & Launch on Startup**:
              - Always-on-top by default.
              - **Hide Cat** into the Windows System Tray or macOS Menu Bar and left-click the tray cat icon anytime to bring it back.
              - Toggle **Launch on Startup** directly from the right-click menu across Windows, macOS, and Linux.
            - **🔌 Local Agent HTTP API (`127.0.0.1:41905`)**:
              - `POST /agent/start` & `POST /agent/stop` to automatically inhibit sleep while your builds or custom CLI scripts run.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

      - name: Upload standalone portable Windows catffeine.exe
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          gh release upload $tag src-tauri/target/release/catffeine.exe --clobber

      - name: Upload standalone Linux catffeine-linux-x86_64 binary
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          cp src-tauri/target/release/catffeine catffeine-linux-x86_64
          chmod +x catffeine-linux-x86_64
          gh release upload "$TAG" catffeine-linux-x86_64 --clobber
